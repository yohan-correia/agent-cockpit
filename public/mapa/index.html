<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="meta-tema" content="#0f1115">
<title>Mapa do grafo</title>
<!-- Tema guardado no aparelho, aplicado ANTES da primeira pintura (cópia literal de
     public/index.html:18-27 — a casca do mapa não tem <base>, então os scripts/estilos abaixo
     são relativos por ../../, sem a armadilha do `<base>` sob /cockpit). -->
<script>
  (function () {
    try {
      var tema = localStorage.getItem('cockpit-tema');
      if (tema) document.documentElement.setAttribute('data-tema', tema);
    } catch (e) { /* modo privado: fica no tema padrão, e tudo bem */ }
  })();
</script>
<link rel="stylesheet" href="../../estilo.css">
<link rel="stylesheet" href="../../grafo-mapa.css">
</head>
<body class="mapa-pagina">
<header id="mapa-topo"></header>
<nav id="mapa-trilha"></nav>
<div id="mapa-dica" role="note"></div>
<main id="mapa-raiz">
<div id="mapa-aviso" role="status"></div>
<div id="mapa-palco"></div>
</main>
<div id="mapa-veu" aria-hidden="true"></div>
<section id="mapa-folha" role="dialog" aria-modal="true" aria-labelledby="mapa-folha-titulo" aria-hidden="true"></section>
<!-- Scripts no FIM do body (molde do public/index.html): o grafo-mapa.js só desenha se achar
     #mapa-raiz, e no <head> ele rodaria antes do body existir — a página ficava em branco. -->
<script src="../../traducoes.js"></script>
<script src="../../i18n.js"></script>
<script src="../../grafo-mapa.js"></script>
</body>
</html>
